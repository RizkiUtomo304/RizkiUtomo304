name: Generate Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *" # update otomatis tiap hari jam 00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: RizkiUtomo304
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=red&color_dots=#00ff00
            dist/retro.gif?palette=github-dark&color_snake=#ff9900&color_dots=#39ff14

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
